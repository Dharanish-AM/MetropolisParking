name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Compile, Test & Assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metropolis_parking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt & Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('backend/build.sbt', 'backend/project/*.sbt', 'backend/project/build.properties') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Compile
        run: sbt compile
        working-directory: backend

      - name: Test
        run: sbt test
        working-directory: backend

      - name: Assemble fat JAR
        run: sbt assembly
        working-directory: backend

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/scala-2.13/metropolis-parking-backend-assembly-*.jar
          retention-days: 1

  frontend:
    name: Frontend — Type-check, Unit Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Unit & component tests
        run: npm test -- --run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: E2E Tests — Full Stack (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/scala-2.13/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Pull Docker images with retry
        run: |
          for i in 1 2 3; do
            docker compose pull && break || (echo "Pull failed, retrying in 5s..." && sleep 5)
          done

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost || true)
            if [ "$STATUS" = "200" ]; then
              echo "Stack ready (HTTP $STATUS after attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "Stack did not become healthy within 300s"
          docker compose logs
          exit 1

      - name: Verify Observability Services Health
        run: |
          echo "Verifying Prometheus metrics endpoint on backend:9464..."
          curl -s http://localhost:9464/metrics | grep -q "http_server" || (echo "Prometheus metrics endpoint check failed" && exit 1)
          
          echo "Verifying Jaeger UI on localhost:16686..."
          curl -s http://localhost:16686/ | grep -i -q "Jaeger" || (echo "Jaeger check failed" && exit 1)
          
          echo "Verifying Loki API on localhost:3100..."
          curl -s http://localhost:3100/ready | grep -q "ready" || (echo "Loki check failed" && exit 1)

          echo "Verifying Grafana on localhost:3000..."
          curl -s http://localhost:3000/api/health | grep -q "ok" || (echo "Grafana check failed" && exit 1)
          
          echo "All observability stack healthchecks passed!"

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          BASE_URL: http://localhost

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down stack
        if: always()
        run: docker compose down -v
