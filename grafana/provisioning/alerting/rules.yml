apiVersion: 1

groups:
  - orgId: 1
    name: Metropolis Alert Rules
    folder: Metropolis
    interval: 10s
    rules:
      - uid: high_latency_alert
        title: High HTTP Request Latency (p95 > 200ms)
        condition: A
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(http_server_duration_ms_bucket[1m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        for: 30s
        annotations:
          summary: HTTP request p95 latency exceeded 200ms threshold
        labels:
          severity: warning

      - uid: db_pool_exhaustion_alert
        title: HikariCP Database Pool High Utilization
        condition: A
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: db_connections_active > 8
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        for: 15s
        annotations:
          summary: HikariCP active database connections exceeded 8 out of 10 limit
        labels:
          severity: critical

      - uid: http_5xx_errors_alert
        title: High HTTP 5xx Server Error Rate
        condition: A
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: sum(rate(http_server_requests_total{status=~"5.."}[1m])) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        for: 10s
        annotations:
          summary: HTTP 5xx server errors detected in MetropolisParking backend
        labels:
          severity: critical
